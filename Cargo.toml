[package]
name = "envelope"
version = "0.1.0"
authors = ["arcnemesys <accelerenzo@proton.me>"]
description = "A terminal UI for viewing and persisting environment variables and PATH entries."
license = "MIT"
edition = "2021"
rust-version = "1.77"
repository = "https://github.com/LorenzoEvans/envelope"
homepage = "https://github.com/LorenzoEvans/envelope"
readme = "README.md"
keywords = ["environment", "terminal", "tui", "path", "shell"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".bashrc", ".todos.json"]

[dependencies]
crossterm = "0.27.0"
ratatui = "0.27.0"

[dev-dependencies]
tempfile = "3.12.0"
