name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: envelope
            artifact: envelope-linux-x86_64
          - name: macos-x86_64
            os: macos-13
            binary: envelope
            artifact: envelope-macos-x86_64
          - name: macos-aarch64
            os: macos-latest
            binary: envelope
            artifact: envelope-macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.target.binary }}" "dist/${{ matrix.target.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: envelope-${{ matrix.target.name }}
          path: dist/*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
